name: Copilot Scheduled Improvement

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 */2 * *"

jobs:
  create-improvement-pr:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - id: improve
        name: Run Copilot improvement
        env:
          GH_TOKEN: ${{ secrets.COPILOT_PAT }}
        run: |
          copilot --autopilot --allow-all -p "Explore this repository..."

          if [ ! -f .copilot-pr.md ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TITLE=$(sed -n 's/^TITLE:[[:space:]]*//p' .copilot-pr.md | head -1)
          BODY=$(sed '1{/^TITLE:/d;}' .copilot-pr.md)

          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "changed=true"
            echo "pr_title=$TITLE"
            echo "pr_body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          rm -f .copilot-pr.md

      - name: Open PR
        if: steps.improve.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automated/copilot-improvement
          commit-message: ${{ steps.improve.outputs.pr_title }}
          title: ${{ steps.improve.outputs.pr_title }}
          body: ${{ steps.improve.outputs.pr_body }}
          delete-branch: true
